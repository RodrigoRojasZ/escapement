# CI mínimo (deuda #10): pytest en cada PR y en master.
#
# Decisiones:
# - windows-latest: fidelidad con el entorno real (Escapement es Windows-céntrico: daemon,
#   tray, SAPI). La suite ya corre 100% headless — el hardware de voz se mockea.
# - Se excluyen los grupos `voice` (CUDA/ONNX/hardware, ~GBs inútiles en un runner) y
#   `semantic` (fastembed; ningún test lo importa). El grupo `local` (openai) SÍ entra:
#   test_local_models.py lo importa de verdad. numpy vive también en `dev` por lo mismo.
# - `--locked`: instala exactamente uv.lock; si el lock quedó desincronizado del
#   pyproject, el job falla en vez de resolver en silencio.
# Validado en limpio (2026-08-26): 753 passed, 1 skipped sin escapement.toml ni data/.
# - `uses:` fijado al SHA del commit (no al tag): un tag es mutable, y si el autor de la action es
#   comprometido puede mover el tag a otro código sin que este archivo cambie. El comentario `# vN`
#   es solo referencia humana. Repo público con "Require actions to be pinned to a full-length
#   commit SHA" activo — un tag suelto rompe el run.

name: tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  publicacion:
    # Este repo es público: el guard vuelve a correr en CI porque un hook local se salta con
    # --no-verify y no existe al editar desde la web de GitHub. Acá solo corren los patrones
    # genéricos: la lista de términos vetados es local y no se publica.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Guard de publicación (sin datos confidenciales)
        run: python scripts/check_publicacion.py --arbol

  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Instalar dependencias (sin voz/GPU ni semantic)
        run: uv sync --locked --no-group voice --no-group semantic
      - name: Correr la suite
        run: uv run --no-sync pytest
